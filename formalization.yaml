alignment:
  namespace: "PlasticThreshold"
  statements:
    - source: "Bedford-Kim 2009 (the spectral statement, eq. 0.3 + Thm; verbatim 'the lambda_n increase to delta-star')"
      lean: "PlasticThreshold.plastic_salem_family"
      module: "Solution"
      status: "proved"
      note: >-
        Canonical largest roots of chi_n below rho for n >= 7, strictly
        increasing, tending to rho.
    - source: "Bedford-Kim 2009 (spectral, complement)"
      lean: "PlasticThreshold.family_pos_of_rho_le"
      module: "Solution"
      status: "proved"
      note: "chi_n strictly positive on [rho, infinity) — nothing at or above the limit."
    - source: "Lehmer 1933 (the polynomial) / Bedford-Kim 2009 (the family at n = 7)"
      lean: "PlasticThreshold.lehmer_first_rung"
      module: "Solution"
      status: "proved"
      note: "chi_7 = (x - 1) * L exactly, over any commutative ring."
    - source: "corollary of plastic_salem_family at n = 7 and the factorization lehmer_first_rung"
      lean: "PlasticThreshold.lehmer_root_below_plastic"
      module: "Solution"
      status: "proved"
      note: "Lehmer's polynomial has a root in [117/100, rho)."
    - source: "this work (exclusion witness; meaning via Blanc-Cantat 2016, cited)"
      lean: "PlasticThreshold.ruler_second_conjugate"
      module: "Solution"
      status: "proved"
      note: >-
        A nonreal quartic root z with 1 < |rho * z| < rho * Q — given
        statements (6) and (7), which formalize the identification of
        the embedding products as the conjugates of rho * Q, a second
        conjugate outside the unit circle, so rho * Q is neither Pisot
        nor Salem.
    - source: "this work (the identification the exclusion corollary rests on)"
      lean: "PlasticThreshold.ruler_conjugates_eq_embedding_products"
      module: "Solution"
      status: "proved"
      note: >-
        A complex number is a root of minpoly(rho * Q) if and only if it
        is a product w * z of a root of x^3 = x + 1 with a root of
        x^4 = x + 1. Proved in both directions.
    - source: "this work (companion to the above)"
      lean: "PlasticThreshold.ruler_conjugates_card"
      module: "Solution"
      status: "proved"
      note: >-
        The root set of minpoly(rho * Q) over the complex numbers has
        exactly twelve elements.

