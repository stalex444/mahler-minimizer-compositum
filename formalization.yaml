      dynamical degree above 1 in characteristic zero, Blanc-Cantat Cor
      2.7(3)). The compared factorization chi_7 = (x - 1) * L places
      Lehmer's polynomial exactly at the n = 7 member of the plastic
      family; the compared root statement locates a root of L in
      [117/100, rho); compared statement (19) exhibits it as the
      Coxeter polynomial of E_10. Lehmer's minimality theorems are not
      formalized here. Lehmer's problem is the tradition the
      minimal-measure tables serve.
    license: "unknown"
