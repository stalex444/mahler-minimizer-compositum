alignment:
  namespace: "PlasticThreshold"
  statements:
    - source: "Bedford-Kim 2009 (the spectral statement, eq. 0.3 + Thm; verbatim 'the lambda_n increase to delta-star')"
      lean: "PlasticThreshold.plastic_salem_family"
      module: "Solution"
      status: "proved"
      note: >-
        Canonical largest roots of chi_n below rho for n >= 7, strictly
        increasing, tending to rho.
    - source: "Bedford-Kim 2009 (spectral, complement)"
      lean: "PlasticThreshold.family_pos_of_rho_le"
      module: "Solution"
      status: "proved"
      note: "chi_n strictly positive on [rho, infinity) — nothing at or above the limit."
    - source: "Lehmer 1933 (the polynomial) / Bedford-Kim 2009 (the family at n = 7)"
      lean: "PlasticThreshold.lehmer_first_rung"
      module: "Solution"
      status: "proved"
      note: "chi_7 = (x - 1) * L exactly, over any commutative ring."
    - source: "corollary of plastic_salem_family at n = 7 and the factorization lehmer_first_rung"
      lean: "PlasticThreshold.lehmer_root_below_plastic"
      module: "Solution"
      status: "proved"
      note: "Lehmer's polynomial has a root in [117/100, rho)."
    - source: "this work (exclusion witness; meaning via Blanc-Cantat 2016, cited)"
      lean: "PlasticThreshold.ruler_second_conjugate"
      module: "Solution"
      status: "proved"
      note: >-
        A nonreal quartic root z with 1 < |rho * z| < rho * Q — given
        statements (6) and (7), a second conjugate outside the unit
        circle, so rho * Q is neither Pisot nor Salem.
    - source: "this work (the identification the exclusion corollary rests on)"
      lean: "PlasticThreshold.ruler_conjugates_eq_embedding_products"
      module: "Solution"
      status: "proved"
      note: >-
        A complex number is a root of minpoly(rho * Q) if and only if it
        is a product w * z of a root of x^3 = x + 1 with a root of
        x^4 = x + 1. Proved in both directions.
    - source: "this work (companion to the above)"
      lean: "PlasticThreshold.ruler_conjugates_card"
      module: "Solution"
      status: "proved"
      note: >-
        The root set of minpoly(rho * Q) over the complex numbers has
        exactly twelve elements.
    - source: "this work (unit certificate; the alpha * beta * gamma = 1 normal form of Drungilas-Dubickas 2016, cited)"
      lean: "PlasticThreshold.ruler_unit"
      module: "Solution"
      status: "proved"
      note: >-
        rho * Q times an explicit degree-11 integer-coefficient
        cofactor equals 1, over any commutative ring — the (3, 4, 12)
        triple realized in the unit-product normal form.
    - source: "this work (nonreciprocity; the regime of Smyth 1971, cited)"
      lean: "PlasticThreshold.rulerPoly_nonreciprocal"
      module: "Solution"
      status: "proved"
      note: >-
        The degree-12 polynomial is neither its own reversal nor the
        negation of its reversal (both fail at the coefficient of
        X^3).
    - source: "this work (product-degree witness at the canonical pair; program context Drungilas-Dubickas-Smyth 2012 through Virbalas 2025, cited; (3, 4, 12) feasibility known — Dubickas-Maciulevicius 2024, cited)"
      lean: "PlasticThreshold.ruler_degree_multiplicative"
      module: "Solution"
      status: "proved"
      note: >-
        deg minpoly(rho * Q) = deg minpoly(rho) * deg minpoly(Q) =
        3 * 4 = 12. No general theorem forces this for products; the
        contribution claimed is the certified witness at the canonical
        pair, not the feasibility fact.
    - source: "this work (sup-equality; the disjointness half near-automatic from Mathlib's of_finrank_coprime, disclosed)"
      lean: "PlasticThreshold.ruler_linearDisjoint"
      module: "Solution"
      status: "proved"
      note: >-
        Q(rho) join Q(Q) = Q(rho * Q), of degree 12 over Q, with the
        two simple extensions linearly disjoint.
    - source: "this work (complete unit-circle census)"
      lean: "PlasticThreshold.ruler_conjugate_census"
      module: "Solution"
      status: "proved"
      note: >-
        Exactly 5 conjugates of modulus > 1, exactly 7 of modulus < 1,
        none on the unit circle — so rho * Q is neither a Pisot nor a
        Salem number.
    - source: "this work (the house; the dominant-root hypothesis of Ouaknine-Worrell 2014, cited as context)"
      lean: "PlasticThreshold.ruler_house"
      module: "Solution"
      status: "proved"
      note: >-
        Every conjugate of rho * Q other than rho * Q itself has
        modulus strictly below rho * Q.
    - source: "this work (exact measure; no novelty claim — the entry is not aware of the identity in the literature as of 2026-08-31; tables tradition Mossinghoff 1998 / Mossinghoff-Rhin-Wu 2008, cited)"
      lean: "PlasticThreshold.ruler_mahler_measure"
      module: "Solution"
      status: "proved"
      note: >-
        M(the degree-12 polynomial) = rho^2 * Q^2 * psi, with psi the
        real root > 1 of psi^4 = psi^3 + 1 (psi = -1/r2 for the same
        quartic's negative real root — disclosed as forced, not a new
        constant).
    - source: "Registry-internal: PALOMAR-2026-08-31-000004 (the consumed degree-4 pinned quantity); the bridge identity is this work"
      lean: "PlasticThreshold.ruler_mahler_eq_quartic_measure"
      module: "Solution"
      status: "proved"
      note: >-
        M(X^4 - X - 1) = psi AND M(the degree-12 polynomial) =
        (rho * Q)^2 * M(X^4 - X - 1) — the registered sibling's
        quantity consumed as a mechanical identity, not prose.
    - source: "this work (order-12 Hadamard recurrence; the order <= mn bound classical — Cerlienco-Mignotte-Piras 1987 / Everest-van der Poorten-Shparlinski-Ward 2003, cited)"
      lean: "PlasticThreshold.product_recurrence_charpoly"
      module: "Solution"
      status: "proved"
      note: >-
        The termwise product of any solutions of the cubic and quartic
        shift recurrences satisfies the order-12 recurrence whose
        characteristic polynomial is the degree-12 polynomial, in any
        Q-algebra.
    - source: "this work (minimality — the annihilator ideal; the in-repo irreducibility of the degree-12 polynomial is load-bearing)"
      lean: "PlasticThreshold.product_annihilator_iff"
      module: "Solution"
      status: "proved"
      note: >-
        A rational polynomial annihilates the product power sequence
        n |-> (rho * Q)^n iff the degree-12 polynomial divides it — in
        particular no nonzero recurrence of order < 12, so the
        classical order <= 3 * 4 bound is an equality at the canonical
        member.

