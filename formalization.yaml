# Review status: self-assessed by the author, with an in-house
# adversarial mock-referee pass applied to this surface before
# submission (see the review block below).

project:
  name: "The plastic number as a spectral threshold: the Bedford-Kim family, its limit, and Lehmer's polynomial as its first member"
  description: >-
    Kernel-checked spectral results for the Bedford-Kim family
    chi_n(x) = x^(n+1)(x^3 - x - 1) + (x^3 + x^2 - 1) — the
    characteristic polynomials of the linear-fractional-recurrence
    rational surface automorphisms, built from the plastic polynomial
    and its (monic) reciprocal. Compared: (1) for n >= 7 the family has a
    canonical root in [117/100, rho), the largest root below rho, the
    sequence is strictly increasing, and it tends to rho — the real
    root of x^3 = x + 1, the plastic number, smallest Pisot number and
    the threshold constant of the Blanc-Cantat classification of
    birational surface dynamical degrees; (2) every chi_n is strictly
    positive on [rho, infinity); (3) the exact factorization
    chi_7 = (x - 1) * L with L Lehmer's degree-10 polynomial, over any
    commutative ring — Lehmer's number, whose logarithm is the proven
    minimum positive entropy of a surface automorphism (McMullen), is
    the n = 7 member of the plastic family; (4) L has a root in
    [117/100, rho); (5) an exclusion witness: a nonreal root z of
    x^4 = x + 1 with 1 < |rho * z| < rho * Q; (6) the twelve embedding
    products ARE the conjugates of rho * Q, and (7) there are exactly
    twelve of them — so (5) exhibits a second conjugate strictly
    outside the unit circle, and rho * Q is therefore neither a Pisot
    nor a Salem number. Whether
    rho is ATTAINED as a dynamical degree is open in the literature;
    no statement here claims it, and no "first formalization" claim is
    made. Hypotheses are inline — rho and Q enter only through their
    defining equations, plus the root-selection inequality 1 < Q on
    the exclusion witness (5), which the quartic's negative real root
    genuinely fails — and the compared statements use only core
    Mathlib vocabulary (Filter.Tendsto, nhds, the complex norm, and
    polynomial root multisets for (6)-(7)) — zero custom definitions.
    The name prefix "ruler" in three statement names is the source
    project's term for the product rho * Q; nothing in any statement
    depends on it.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  arxiv: ["math.DS", "math.NT"]
  msc2020: ["11R06", "14E07", "37B40"]

sources:
  - title: "Dynamics of rational surface automorphisms: linear fractional recurrences"
    authors:
      - "Eric Bedford"
      - "Kyounghee Kim"
    id: "Journal of Geometric Analysis 19 (2009), 553-583"
    # Crossref-verified 2026-08-25 (mock referee): JGA 19, issue 3,
    # 553-583, DOI below; the arXiv abs page carries no journal-ref
    # field, so Crossref is the authority here. arXiv: math/0611297.
    type: "article"
    location: "https://doi.org/10.1007/s12220-009-9077-8"
    relationship: "formalizes"
    note: >-
      The paper constructs, for n >= 7 and suitable parameters,
      rational surface automorphisms whose action on cohomology has
      characteristic polynomial chi_n(x) = x^(n+4) - x^(n+2) - x^(n+1)
      + x^3 + x^2 - 1 (their eq. 0.3; equivalently x^(n+1)(x^3 - x - 1)
      + (x^3 + x^2 - 1)), with positive entropy log lambda_n, lambda_n
      a Salem number, and proves the lambda_n increase to the real root
      of t^3 = t + 1 (verbatim: "the lambda_n increase to delta-star
      as n -> infinity", delta-star that root — the plastic number). This
      entry formalizes the SPECTRAL half: the canonical largest roots
      below rho, their strict increase, and the convergence to rho. The
      dynamical realization (that lambda_n is the entropy/spectral
      radius of an automorphism), the Salem property of the roots, and
      the absence of roots in (1, 117/100) are NOT formalized — they
      are the paper's geometric content, cited here.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Dynamical degrees of birational transformations of projective surfaces"
    authors:
      - "Jeremy Blanc"
      - "Serge Cantat"
    id: "Journal of the American Mathematical Society 29 (2016), 415-471"
    # Crossref-verified 2026-08-31, first-hand: DOI 10.1090/jams831 (no
    # slash) resolves and matches JAMS 29 (2016) 415-471; arXiv
    # 1307.0361 (ar5iv full text verified, two passes).
    type: "article"
    location: "https://doi.org/10.1090/jams831"
    relationship: "background"
    note: >-
      The classification the compared statements sit in: dynamical
      degrees of birational surface transformations are Pisot or Salem
      numbers (their Thm 1.2, credited to Diller-Favre); the plastic
      number is named there as the infimum of the Pisot class and the
      automorphism threshold (Sec 1.1.2, Cor 2.7). Not formalized here;
      via this theorem (cited), the compared exclusion witness implies
      rho * Q is not the dynamical degree of any birational surface
      transformation.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Factorization of certain cyclotomic functions"
    authors:
      - "Derrick H. Lehmer"
    id: "Annals of Mathematics 34 (1933), 461-479"
    type: "article"
    location: "https://doi.org/10.2307/1968172"
    # Crossref-verified 2026-08-25 (mock referee): DOI confirmed,
    # Annals of Mathematics 34(3), 1933, first page 461.
    relationship: "background"
    note: >-
      The source of Lehmer's degree-10 polynomial, whose largest root
      (Lehmer's number, approximately 1.17628) is the smallest known
      Salem number, and whose logarithm is the proven minimum positive
      entropy of a surface automorphism (McMullen, Publ. Math. IHES 105
      (2007), Thm 1.2; equivalently Lehmer's number is the minimum
      dynamical degree above 1 in characteristic zero, Blanc-Cantat Cor
      2.7(3)). The compared factorization chi_7 = (x - 1) * L places
      Lehmer's polynomial exactly at the n = 7 member of the plastic
      family; the compared root statement locates a root of L in
      [117/100, rho). Lehmer's minimality theorems are not formalized
      here.
    license: "unknown"
    author_endorsement: "n/a"

  - title: "Dynamics on blowups of the projective plane"
    authors:
      - "Curtis T. McMullen"
    id: "Publications Mathematiques de l'IHES 105 (2007), 49-89"
    type: "article"
    location: "https://doi.org/10.1007/s10240-007-0004-x"
    # Crossref-verified 2026-08-31: Publ. Math. IHES 105 (2007);
    # numdam open-access copy: numdam.org/item/PMIHES_2007__105__49_0/
    relationship: "background"
    note: >-
      Cited for the minimum-entropy status of Lehmer's number: Thm 1.2
      (any positive-entropy automorphism of a compact complex surface
      has h(F) >= log lambda_Lehmer) and Cor 1.3 (attained by his
      F_10) — verified from the paper text 2026-08-25 (mock referee).
      Not formalized here. Additionally, McMullen's eq (2.4) gives the
      characteristic-polynomial family of the Coxeter elements of W_n
      as P_n(t) = [t^(n-2)(t^3 - t - 1) + (t^3 + t^2 - 1)]/(t - 1) —
      this entry's chi family divided by (t - 1) — with the remark that
      Q_10 coincides with Lehmer's polynomial: the compared
      factorization chi_7 = (x - 1) * L is the kernel certificate of
      that remark.
    license: "unknown"
    author_endorsement: "n/a"

