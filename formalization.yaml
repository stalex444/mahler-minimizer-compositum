status:
  scope: >-
    Formalized, 17 compared theorems, hypotheses inline. (1)
    plastic_salem_family: existence of the canonical root sequence of
    chi_n in [117/100, rho) for n >= 7 — largest below rho, strictly
    increasing, tending to rho. (2) family_pos_of_rho_le: chi_n > 0 on
    [rho, infinity). (3) lehmer_first_rung: chi_7 = (x - 1) * L over
    any commutative ring. (4) lehmer_root_below_plastic: L has a root
    in [117/100, rho). (5) ruler_second_conjugate: a nonreal z with
    z^4 = z + 1 and 1 < |rho * z| < rho * Q. (6)
    ruler_conjugates_eq_embedding_products: a complex number is a root
    of minpoly(rho * Q) iff it is a product of a cubic root with a
    quartic root — both directions. (7) ruler_conjugates_card: that
    root set has exactly twelve elements. (8) ruler_unit: rho * Q
    times an explicit degree-11 cofactor equals 1, over any
    commutative ring. (9) rulerPoly_nonreciprocal: the degree-12
    polynomial is neither its reversal nor the reversal's negation.
    (10) ruler_degree_multiplicative: deg minpoly(rho * Q) =
    deg minpoly(rho) * deg minpoly(Q). (11) ruler_linearDisjoint:
    Q(rho) join Q(Q) = Q(rho * Q), of finrank 12, with Q(rho) and
    Q(Q) linearly disjoint. (12) ruler_conjugate_census: exactly 5
    conjugates of modulus > 1, exactly 7 of modulus < 1, none of
    modulus 1 (Set.ncard). (13) ruler_house: every conjugate other
    than rho * Q has modulus < rho * Q. (14) ruler_mahler_measure:
    M(the degree-12 polynomial) = rho^2 * Q^2 * psi with
    psi^4 = psi^3 + 1, 1 < psi. (15) ruler_mahler_eq_quartic_measure:
    M(X^4 - X - 1) = psi AND M(the degree-12 polynomial) =
    (rho * Q)^2 * M(X^4 - X - 1). (16) product_recurrence_charpoly:
    the termwise product of any cubic-recurrence and
    quartic-recurrence solutions in a Q-algebra satisfies the order-12
    recurrence with the degree-12 characteristic polynomial. (17)
    product_annihilator_iff: a rational polynomial annihilates the
    product power sequence iff the degree-12 polynomial divides it.
    NOT formalized (cited): the dynamical realization of the roots as
    automorphism entropies; the Salem property; the emptiness of
    (1, 117/100); the Blanc-Cantat classification; Smyth's and
    Siegel's minimality theorems; the minimality of the pair (rho, Q)
    itself, kernel-certified in the registered sibling entry
    PALOMAR-2026-08-31-000004. No physical claim is part of the
    compared statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is at most
  # [propext, Classical.choice, Quot.sound]; lehmer_first_rung and
  # ruler_unit need propext and Quot.sound only.

