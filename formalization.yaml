fidelity:
  divergences: >-
    Bedford-Kim's theorem is geometric: for n >= 7 and suitable
    parameters the maps are automorphisms of rational surfaces with
    entropy log lambda_n, lambda_n a Salem number, and the lambda_n
    increase to the plastic number. This entry formalizes the spectral
    statement about the polynomial family: the canonical largest roots
    below rho, their strict increase, and the limit (version 1), and
    now, through the Coxeter bridge, the Salem property of those roots
    and the emptiness of (1, 117/100) for n >= 7 (version 2, statements
    (21)-(22)). The dynamical realization remains cited, not
    formalized. The exclusion corollary for rho * Q (not a birational
    surface dynamical degree) additionally requires the cited
    Blanc-Cantat classification; the identification of the products
    of embeddings as the conjugates of rho * Q is NOT cited but
    formalized here, as statements (6) and (7). All finite margin
    claims are exact: the brackets are rational and kernel-decided; no
    floating point enters any compared statement or proof. Four
    disclosures on the compositum half. (i) Internal Vieta closed
    forms are carried division-free (e.g. Q * r2 * |z|^2 = -1 rather
    than |z|^2 = -1/(Q * r2)); the compared statements are unaffected.
    (ii) The linear-disjointness half of statement (11) is
    near-automatic from Mathlib's
    IntermediateField.LinearDisjoint.of_finrank_coprime given the
    kernel-held degrees 3 and 4; the substantive content is the
    sup-equality. (iii) psi enters statements (14)-(15) only through
    its defining equation psi^4 = psi^3 + 1 and 1 < psi, inline; it is
    not a new constant but forced by the same quartic (psi = -1/r2 for
    the quartic's negative real root r2), and no numeric value of psi,
    rho, or Q enters any statement or proof. (iv) The minimality
    statement (17) is the annihilator iff for the canonical member of
    the product family — the power sequence n |-> (rho * Q)^n — not
    for every not-identically-zero product of solutions; the classical
    order <= 3 * 4 bound is certified an equality at that canonical
    member, which is what the minimal-polynomial identification
    supports without additional nonvanishing hypotheses. Four
    disclosures on the Coxeter bridge. (v) Challenge.lean imports
    Mathlib only, so the E_m Cartan matrix is supplied entrywise
    through a hypothesis hA and the Coxeter element is written inline
    as the ordered product of the matrices 1 - e_i e_i^T A; the node
    ordering is long arm first (nodes 0..m-5), centre m-4, then the
    one-edge arm m-3 and the two-edge arm m-2, m-1 — the E_10 literal
    of (19) is therefore not in Bourbaki order (a relabelling; the
    Coxeter polynomial is independent of it, and the docstrings state
    the ordering). (vi) The Coxeter element is the product in the
    order s_0 s_1 ... s_{m-1}; for a tree all Coxeter elements are
    conjugate, so the charpoly is the same for any order (classical;
    not formalized — the statements are about this ordered product).
    (vii) The Salem predicate of (22) is written out verbatim from the
    registered Salem entry rather than imported; the certificate
    modules carried from that entry are byte-identical. (viii)
    PdtSalemPlasticPattern is a trimmed copy of a parent-development
    module (disclosed above); its lines are verbatim and it introduces
    nothing new.

