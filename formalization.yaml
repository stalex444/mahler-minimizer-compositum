      The classification the exclusion corollary sits in: dynamical
      degrees of birational surface transformations are Pisot or Salem
      numbers (their Thm 1.2, credited to Diller-Favre), and the
      spectrum is a well-ordered set; the plastic number is named
      there as the infimum of the Pisot class and the automorphism
      threshold (Sec 1.1.2, Cor 2.7). Not formalized here; via this
      theorem (cited), the compared census implies rho * Q is not the
      dynamical degree of any birational surface transformation.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Dynamics on blowups of the projective plane"
    authors:
      - "Curtis T. McMullen"
    id: "Publications Mathematiques de l'IHES 105 (2007), 49-89"
    type: "article"
    location: "https://doi.org/10.1007/s10240-007-0004-x"
    # Crossref-verified 2026-08-31: Publ. Math. IHES 105 (2007);
    # numdam open-access copy: numdam.org/item/PMIHES_2007__105__49_0/
    relationship: "background"
    note: >-
      Cited for the minimum-entropy status of Lehmer's number: Thm 1.2
      (any positive-entropy automorphism of a compact complex surface
      has h(F) >= log lambda_Lehmer) and Cor 1.3 (attained by his
      F_10) — verified from the paper text 2026-08-25 (mock referee).
      Not formalized here. Additionally, McMullen's eq (2.4) gives the
      characteristic-polynomial family of the Coxeter elements of W_n
      as P_n(t) = [t^(n-2)(t^3 - t - 1) + (t^3 + t^2 - 1)]/(t - 1) —
      this entry's chi family divided by (t - 1) (index shift: McMullen's n is this entry's n + 3, so his Q_10 is the n = 7 member) — with the remark that
      Q_10 coincides with Lehmer's polynomial: the compared
      factorization chi_7 = (x - 1) * L is the kernel certificate of
      that remark.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Salem/Pisot Numbers in the Weyl Spectrum"
    authors:
      - "Kyounghee Kim"
    id: "arXiv:2312.17729 (preprint; v2, 20 Jan 2025)"
    # Verified 2026-08-31 from the arXiv abstract: title and author
    # confirmed; NO journal reference as of v2 — cited as an arXiv
    # preprint only, not as published.
    type: "misc"
    location: "https://arxiv.org/abs/2312.17729"
    relationship: "background"
    note: >-
      A live instance of the membership question — which specific
      Salem/Pisot numbers are realized as dynamical degrees of
      birational maps — legitimizing the question the exclusion
      corollary answers negatively at rho * Q. arXiv preprint.
    license: "unknown"
    author_endorsement: "n/a"

