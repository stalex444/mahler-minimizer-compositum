sources:
  - title: "Dynamics of rational surface automorphisms: linear fractional recurrences"
    authors:
      - "Eric Bedford"
      - "Kyounghee Kim"
    id: "Journal of Geometric Analysis 19 (2009), 553-583"
    # Crossref-verified 2026-08-25 (mock referee): JGA 19, issue 3,
    # 553-583, DOI below; the arXiv abs page carries no journal-ref
    # field, so Crossref is the authority here. arXiv: math/0611297.
    type: "article"
    location: "https://doi.org/10.1007/s12220-009-9077-8"
    relationship: "formalizes"
    note: >-
      The paper constructs, for n >= 7 and suitable parameters,
      rational surface automorphisms whose action on cohomology has
      characteristic polynomial chi_n(x) = x^(n+4) - x^(n+2) - x^(n+1)
      + x^3 + x^2 - 1 (their eq. 0.3; equivalently x^(n+1)(x^3 - x - 1)
      + (x^3 + x^2 - 1)), with positive entropy log lambda_n, lambda_n
      a Salem number, and proves the lambda_n increase to the real root
      of t^3 = t + 1 (verbatim: "the lambda_n increase to delta-star
      as n -> infinity", delta-star that root — the plastic number). This
      entry formalizes the SPECTRAL half: the canonical largest roots
      below rho, their strict increase, and the convergence to rho; in
      version 2 also (via statements (21)-(22), for n >= 7) the Salem
      property of the roots and the absence of roots in (1, 117/100).
      The dynamical realization (that lambda_n is the entropy/spectral
      radius of an automorphism) is NOT formalized — it is the paper's
      geometric content, cited here.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Cyclotomic factors of Coxeter polynomials"
    authors:
      - "Benedict H. Gross"
      - "Eriko Hironaka"
      - "Curtis T. McMullen"
    id: "Journal of Number Theory 129 (2009), no. 5, 1034-1043"
    # Crossref-verified 2026-10-16 (lit-scout, full text read): DOI
    # 10.1016/j.jnt.2008.09.021; J. Number Theory 129, 1034-1043.
    type: "article"
    location: "https://doi.org/10.1016/j.jnt.2008.09.021"
    relationship: "formalizes"
    note: >-
      Section 1 records, for the E_n diagram (n >= 3), the classical
      identity (x - 1) E_n(x) = x^(n-2)(x^3 - x - 1) + (x^3 + x^2 - 1)
      for the Coxeter polynomial E_n(x) = charpoly of the Coxeter
      element, with references (McKee-Rowlinson-Smyth 1999, Lemma 5;
      Hironaka), proves it as Corollary 4.3 for n >= 4 — exactly the
      compared range m >= 4; the n = 3 case (E_3 = A_2 + A_1) is outside
      (18) — and records that E_10 is Lehmer's polynomial. Compared
      statement (18) is that identity, kernel-checked for every m >= 4
      with the Cartan matrix given entrywise; (19) is the E_10 instance.
      The identity is not the paper's; the paper's own results on
      cyclotomic factors and the number of roots on the unit circle are
      not formalized.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Coxeter groups, Salem numbers and the Hilbert metric"
    authors:
      - "Curtis T. McMullen"
    id: "Publications Mathematiques de l'IHES 95 (2002), 151-183"
    # Crossref-verified 2026-10-16: DOI 10.1007/s102400200001; Publ.
    # Math. IHES 95 (2002) 151-183.
    type: "article"
    location: "https://doi.org/10.1007/s102400200001"
    relationship: "background"
    note: >-
      Proposition 7.1: for a hyperbolic crystallographic Coxeter
      system, every w in W with spectral radius lambda(w) > 1 has
      lambda(w) a Salem number of degree at most |S| (in the proof, w
      has exactly the two eigenvalues lambda and 1/lambda off the unit
      circle); E_m is hyperbolic and crystallographic for m >= 10.
      Theorem 7.6 and its corollaries classify the
      Coxeter systems whose Coxeter-element spectral radius lies below
      the plastic number: the E_n = Y_{2,3,n-3} ladder and Y_{2,4,5},
      with the E_n values rising to rho and E_10 = Lehmer's number the
      minimum. Compared statements (20)-(22) are the kernel-checked
      E_m case of that picture (the Salem property for every m >= 10,
      the strict increase, the limit rho); the classification of ALL
      systems below rho is cited, not formalized.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Coxeter groups and M-matrices"
    authors:
      - "Robert B. Howlett"
    id: "Bulletin of the London Mathematical Society 14 (1982), 137-141"
    # Crossref-verified 2026-10-16: DOI 10.1112/blms/14.2.137; Bull.
    # LMS 14, 137-141 (1982).
    type: "article"
    location: "https://doi.org/10.1112/blms/14.2.137"
    relationship: "background"
    note: >-
      Theorem 2.1: the identity expressing the Coxeter element through
      the unipotent upper part U of the Cartan matrix (c = -U^{-1} U^T
      in the symmetric case; here used as U * c = U - A), on which the
      determinant recurrence of statement (18) rests. The identity is
      re-proved in-repo (module PdtCoxElt, U_mul_cox, by a list
      induction, for an arbitrary square matrix — symmetry and the
      diagonal 2 enter only in charpoly_cox); cited for attribution.
    license: "unknown"
    author_endorsement: "n/a"
