    - source: "this work (order-12 Hadamard recurrence; the order <= mn bound classical — Cerlienco-Mignotte-Piras 1987 / Everest-van der Poorten-Shparlinski-Ward 2003, cited)"
      lean: "PlasticThreshold.product_recurrence_charpoly"
      module: "Solution"
      status: "proved"
      note: >-
        The termwise product of any solutions of the cubic and quartic
        shift recurrences satisfies the order-12 recurrence whose
        characteristic polynomial is the degree-12 polynomial, in any
        Q-algebra.
    - source: "this work (minimality — the annihilator ideal; the in-repo irreducibility of the degree-12 polynomial is load-bearing)"
      lean: "PlasticThreshold.product_annihilator_iff"
      module: "Solution"
      status: "proved"
      note: >-
        A rational polynomial annihilates the product power sequence
        n |-> (rho * Q)^n iff the degree-12 polynomial divides it — in
        particular no nonzero recurrence of order < 12, so the
        classical order <= 3 * 4 bound is an equality at the canonical
        member.
    - source: "classical E_n Coxeter-polynomial identity (recorded in Gross-Hironaka-McMullen 2009, Section 1, proved there as Cor. 4.3 for n >= 4, citing McKee-Rowlinson-Smyth 1999 Lemma 5); McMullen 2007 eq (2.4); Howlett 1982 Thm 2.1 for the determinant route"
      lean: "PlasticThreshold.coxeter_E_bridge"
      module: "Solution"
      status: "proved"
      note: >-
        For every m >= 4 and the E_m generalized Cartan matrix given
        entrywise, (X - 1) * charpoly(s_0 ... s_{m-1}) =
        X^(m-2)(X^3 - X - 1) + (X^3 + X^2 - 1): the spectral half of
        this entry is the E_m Coxeter spectrum.
    - source: "classical (Gross-Hironaka-McMullen 2009 Section 1; McMullen 2002): the Coxeter polynomial of E_10 is Lehmer's"
      lean: "PlasticThreshold.coxeter_E10_lehmer"
      module: "Solution"
      status: "proved"
      note: >-
        With the E_10 Cartan matrix written out as a 10 x 10 literal
        (long-arm-first node order), the characteristic polynomial of
        the Coxeter element is Lehmer's degree-10 polynomial.
    - source: "McMullen 2002, Section 7 (the E_n ladder rising to the plastic number); composition of (18) with (1)"
      lean: "PlasticThreshold.coxeter_E_plastic"
      module: "Solution"
      status: "proved"
      note: >-
        For every m >= 10 the E_m Coxeter polynomial has a root
        lambda_m in [117/100, rho) with no real root above it; the
        lambda_m increase strictly and tend to rho.
    - source: "McMullen 2002, Prop. 7.1 (for hyperbolic crystallographic Coxeter systems: the spectrum of an element of spectral radius above 1 is unimodular except lambda and 1/lambda), the E_m case; composition of (18) with the registered Salem entry's trichotomy"
      lean: "PlasticThreshold.coxeter_E_spectrum"
      module: "Solution"
      status: "proved"
      note: >-
        For every m >= 10 the complexified Coxeter element has an
        eigenvalue lambda in (1, rho), and every complex eigenvalue is
        unimodular, lambda, or 1/lambda.
    - source: "McMullen 2002, Prop. 7.1 (for hyperbolic crystallographic Coxeter systems, spectral radii above 1 are Salem numbers), the E_m case, m >= 10; Salem predicate as in PALOMAR-2026-09-02-000003"
      lean: "PlasticThreshold.coxeter_E_salem"
      module: "Solution"
      status: "proved"
      note: >-
        For every m >= 10 the dominant eigenvalue lambda in (1, rho) is
        a Salem number: an algebraic integer > 1 with all other
        conjugates in the closed unit disk, at least one on the unit
        circle, and 1/lambda among them.

