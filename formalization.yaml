    - source: "this work (unit certificate; the alpha * beta * gamma = 1 normal form of Drungilas-Dubickas 2016, cited)"
      lean: "PlasticThreshold.ruler_unit"
      module: "Solution"
      status: "proved"
      note: >-
        rho * Q times an explicit degree-11 integer-coefficient
        cofactor equals 1, over any commutative ring — the (3, 4, 12)
        triple realized in the unit-product normal form.
    - source: "this work (nonreciprocity; the regime of Smyth 1971, cited)"
      lean: "PlasticThreshold.rulerPoly_nonreciprocal"
      module: "Solution"
      status: "proved"
      note: >-
        The degree-12 polynomial is neither its own reversal nor the
        negation of its reversal (both fail at the coefficient of
        X^3).
    - source: "this work (product-degree witness at the canonical pair; program context Drungilas-Dubickas-Smyth 2012 through Virbalas 2025, cited; (3, 4, 12) feasibility known — Dubickas-Maciulevicius 2024, cited)"
      lean: "PlasticThreshold.ruler_degree_multiplicative"
      module: "Solution"
      status: "proved"
      note: >-
        deg minpoly(rho * Q) = deg minpoly(rho) * deg minpoly(Q) =
        3 * 4 = 12. No general theorem forces this for products; the
        contribution claimed is the certified witness at the canonical
        pair, not the feasibility fact.
    - source: "this work (sup-equality; the disjointness half near-automatic from Mathlib's of_finrank_coprime, disclosed)"
      lean: "PlasticThreshold.ruler_linearDisjoint"
      module: "Solution"
      status: "proved"
      note: >-
        Q(rho) join Q(Q) = Q(rho * Q), of degree 12 over Q, with the
