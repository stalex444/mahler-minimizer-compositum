version: "v0.4"
# Review status: self-assessed by the author, with in-house adversarial
# mock-referee passes applied to this surface before submission (see the
# review block below). VERSION 2 of the registered entry
# PALOMAR-2026-09-01-000005 (version 1: seventeen compared theorems at
# Lean 4.31.0 / Mathlib fabf563a, registered 2026-09-01). Version 2
# re-establishes the seventeen byte-for-byte on Lean 4.35.0-rc2 /
# Mathlib 0653561 and adds five (the E_m Coxeter bridge).

project:
  name: "The compositum of the two Mahler minimizers: exact measure, conjugate census, house, and minimal product recurrence, with the Bedford-Kim plastic family, Lehmer's polynomial, and the E_m Coxeter bridge"
  description: >-
    Kernel-checked certificates for the multiplicative compositum of
    the two registered Mahler minimizers — rho, the real root of
    x^3 = x + 1 (the plastic number: Smyth's nonreciprocal minimum,
    Siegel's smallest Pisot number) and Q, the real root > 1 of
    x^4 = x + 1 (the degree-4 entry of the minimal-measure tables) —
    together with the Bedford-Kim spectral family whose limit rho is,
    and (new in version 2) the identification of that family with the
    Coxeter-element spectra of the E_m star trees. Twenty-two compared
    theorems. The spectral half: (1) for n >= 7 the family
    chi_n(x) = x^(n+1)(x^3 - x - 1) + (x^3 + x^2 - 1) has a canonical
    root in [117/100, rho), largest below rho, strictly increasing,
    tending to rho; (2) every chi_n is strictly positive on
    [rho, infinity); (3) chi_7 = (x - 1) * L exactly, over any
    commutative ring, with L Lehmer's degree-10 polynomial; (4) L has
    a root in [117/100, rho). The compositum half, for the degree-12
    minimal polynomial of rho * Q (written out in full in every
    compared statement): (5) an exclusion witness — a nonreal quartic
    root z with 1 < |rho * z| < rho * Q; (6) the twelve embedding
    products ARE the conjugates of rho * Q, both directions; (7) there
    are exactly twelve of them; (8) rho * Q is an algebraic unit, via
    an explicit degree-11 cofactor over any commutative ring — the
    (3, 4, 12) triple in the normal form alpha * beta * gamma = 1;
    (9) the degree-12 polynomial is not reciprocal (neither its
    reversal nor the reversal's negation), placing it in the regime of
    Smyth's theorem; (10) degree multiplicativity — deg minpoly(rho*Q)
    = deg minpoly(rho) * deg minpoly(Q) = 12; (11) the compositum in
    sup form Q(rho) join Q(Q) = Q(rho*Q), of degree 12, with the two
    simple extensions linearly disjoint; (12) the complete unit-circle
    census — EXACTLY 5 conjugates strictly outside, EXACTLY 7 strictly
    inside, NONE on the circle, so rho * Q is neither a Pisot nor a
    Salem number; (13) the house — every conjugate other than rho * Q
    has modulus strictly below rho * Q; (14) the exact Mahler measure
    M = rho^2 * Q^2 * psi, where psi is the real root > 1 of
    psi^4 = psi^3 + 1; (15) the registry bridge — M(X^4 - X - 1) = psi
    and M(rulerPoly) = (rho * Q)^2 * M(X^4 - X - 1), re-proving in-repo
    the quantity pinned in registered entry PALOMAR-2026-08-31-000004;
    (16) the order-12 Hadamard product recurrence — the termwise
    product of any solutions of the cubic and quartic shift
    recurrences satisfies the order-12 recurrence whose characteristic
    polynomial is exactly the degree-12 polynomial, in any Q-algebra;
    (17) the annihilator ideal of the product power sequence
    n |-> (rho * Q)^n is EXACTLY the principal ideal of the degree-12
    polynomial — the classical order <= 3 * 4 bound is an equality,
    forced by the polynomial's kernel-held irreducibility. THE COXETER
    BRIDGE (version 2), for the star trees E_m = T(2,3,m-3) with
    generalized Cartan matrix A given entrywise and Coxeter element
    c = s_0 s_1 ... s_{m-1}, each simple reflection the matrix
    s_i = 1 - e_i e_i^T A of the geometric representation: (18) for
    every m >= 4, (X - 1) * charpoly(c) = X^(m-2)(X^3 - X - 1) +
    (X^3 + X^2 - 1) — the classical E_n Coxeter-polynomial identity
    (recorded in Gross-Hironaka-McMullen 2009, Section 1, and proved
    there as Cor. 4.3 for n >= 4), whose right-hand side is chi_{m-3}: the spectral half of this entry IS
    the E_m Coxeter spectrum; (19) with the E_10 Cartan matrix written
    out, the Coxeter polynomial of E_10 is Lehmer's polynomial; (20)
    for every m >= 10 the Coxeter polynomial of E_m has a root
    lambda_m in [117/100, rho) with no real root above it, the
    lambda_m strictly increasing and tending to rho; (21) for every
    m >= 10 the complexified Coxeter element has an eigenvalue
    lambda in (1, rho) and every complex eigenvalue is unimodular,
    lambda, or 1/lambda; (22) that lambda dominates the modulus of
    every eigenvalue and is a Salem number, for every m >= 10, with
    the Salem predicate written out as in the registered entry
    PALOMAR-2026-09-02-000003. Two disclosures of version 1 are
    discharged by (21)-(22) for n >= 7: the Salem property of the
    Bedford-Kim roots is now kernel-held, and the interval
    (1, 117/100) is now swept (the only eigenvalues off the unit circle
    are lambda_m and its inverse). The results address four research
    audiences: the degree problem for products and composita of
    algebraic numbers (the certified (3,4,12) witness at a canonically
    distinguished pair, in the field's own unit-product normal form);
    the Mahler-measure tradition (the measure of the composed product
    of the two degree-minimal polynomials, in closed form in the
    second-smallest Pisot number); composed products of polynomials (a
    certified rational instance where the finite-field coprimality
    criterion is unavailable and irreducibility is proved by
    elimination); and, new, Coxeter groups and Salem numbers
    (McMullen; Gross-Hironaka-McMullen; Hironaka's Lehmer program): the
    E_m Coxeter spectra, their Salem radii and their limit rho as one
    kernel-checked family — with the Lean audience served by concrete
    exercise of the Mahler-measure, linear-disjointness,
    Matrix.charpoly and spectrum APIs. Like the golden ratio, rho * Q
    is an algebraic unit of norm -1; the compared cofactor identity is
    that norm computation, certified. No novelty claim is made for the
    measure identity (the entry is not aware of it in the literature;
    the claimed contribution is the kernel certificate), none for the
    mathematics of (18)-(22), which is classical (the claimed
    contribution is the kernel-checked bridge from the registered
    Bedford-Kim family to the E_m Coxeter elements, for every m >= 4
    (bridge) and every m >= 10 (spectrum, Salem) at once),
    no "first formalization" claim is made anywhere, and whether rho
    is ATTAINED as a dynamical degree is open in the literature — no
    statement claims it. Hypotheses are inline: rho, Q, psi enter only
    through their defining equations plus root-selection inequalities,
    the E_m Cartan matrices only through their entries, and the
    compared statements use only core Mathlib vocabulary
    (Filter.Tendsto, nhds, the complex norm, minpoly,
    Polynomial.rootSet, Set.ncard, Polynomial.mahlerMeasure,
    IntermediateField adjoin/sup, Module.finrank, Finset.range sums,
    Matrix.charpoly, Matrix.diagonal, List.finRange/List.prod, matrix
    literals, Matrix.map, spectrum, IsIntegral, Polynomial.aeval) —
    zero custom definitions. The name prefix "ruler" in statement
    names is the source project's term for the product rho * Q;
    nothing in any statement depends on it.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

