    relationship: "background"
    note: >-
      Smyth's theorem: the Mahler measure of a nonreciprocal algebraic
      integer is at least the real root of x^3 - x - 1 — the cubic
      factor of this entry's pair is Smyth's constant, the literature's global nonreciprocal minimizer, not this entry's selection. The
      compared nonreciprocity statement (9) places the degree-12
